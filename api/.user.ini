; ============================================================
; DCC Sheet — limites d'upload pour l'export/import global.
; ------------------------------------------------------------
; Rejet constaté (11/10/2026) : un ZIP d'export de ~15 Mo dépasse
; post_max_size (8 Mo par défaut). PHP émet alors un Warning HTML
; *avant* tout code (*<br /><b>Warning</b>: ... POST Content-Length
; ... exceeds the limit ...*) et vide $_POST/$_FILES : maps.php
; répond {"error":"Fichier absent"} précédé du Warning, et le
; res.json() du client échoue (« Unexpected token '<' ... »).
; Ces 2 directives portent le plafond documenté à 64 Mo, comme le
; php-wasm de l'APK (cgi-worker.mjs) ; le client refuse au-delà
; avec un message explicite (cf. importAllCharacters, script.js).
; Lu par le serveur embarqué (php -S), CGI et FPM (le fichier est
; relu au plus toutes les 300 s — redémarrer en cas de doute).
; ============================================================
post_max_size = 70M
upload_max_filesize = 64M
