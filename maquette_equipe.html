<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maquette Onglet Equipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1eee8;
      --paper: #fff;
      --ink: #171717;
      --muted: #706d68;
      --line: #d7d1c8;
      --red: #c0392b;
      --green: #27ae60;
      --field-bg: #dde4f0;
      --input-border: #9aa5b4;
      --header-bg: #1a1a2e;
      --header-text: #fff;
      --tab-active: #c0392b;
      --tab-bg: #e8e5df;
      --font-heading: 'Barlow Condensed', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius: 6px;
      --radius-sm: 4px;
      --topbar-h: 56px;
      --tabbar-h: 48px;
    }

    [data-theme="dark"] {
      --bg: #1a1917;
      --paper: #242320;
      --ink: #e8e4dc;
      --muted: #9a9590;
      --line: #4a4744;
      --field-bg: #2a2926;
      --input-border: #5a5754;
      --header-bg: #0d0d1a;
      --header-text: #e8e4dc;
      --tab-active: #e84535;
      --tab-bg: #2a2926;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
    }

    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      height: var(--topbar-h); padding: 0 16px;
      background: var(--header-bg); color: var(--header-text);
    }

    .logo {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-heading); font-weight: 800; font-size: 18px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .logo span { color: var(--yellow, #f2bd3d); }

    .tab-bar {
      position: sticky; top: var(--topbar-h); z-index: 90;
      display: flex; gap: 4px; padding: 8px 16px;
      background: var(--tab-bg); overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0; padding: 8px 20px;
      font-family: var(--font-heading); font-weight: 700; font-size: 14px;
      text-transform: uppercase; letter-spacing: 0.5px;
      border-radius: var(--radius) var(--radius) 0 0;
      background: transparent; color: var(--muted);
      transition: background 0.2s, color 0.2s;
      border: none; cursor: pointer;
    }
    .tab:hover { color: var(--ink); background: var(--paper); }
    .tab.active { background: var(--paper); color: var(--tab-active); }

    .tab-equipe {
      background: var(--tab-active);
      color: #fff;
    }
    .tab-equipe:hover {
      background: var(--tab-active);
      filter: brightness(1.1);
    }

    .main { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

    .section-bar {
      font-family: var(--font-heading); font-weight: 800; font-size: 13px;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--header-text); background: var(--header-bg);
      padding: 8px 14px; border-radius: var(--radius);
      margin: 20px 0 12px;
    }
    .section-bar:first-child { margin-top: 0; }

    /* Tables */
    .team-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .team-table th {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      padding: 6px 8px;
      text-align: center;
      white-space: nowrap;
    }

    .team-table td {
      border: 1px solid var(--line);
      padding: 4px 6px;
      text-align: center;
      vertical-align: middle;
    }

    .team-table tr:nth-child(even) {
      background: rgba(0,0,0,0.02);
    }

    .team-table input[type="text"],
    .team-table input[type="number"] {
      width: 100%;
      padding: 4px 6px;
      font-size: 13px;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--field-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      text-align: center;
      outline: none;
    }

    .team-table input:focus {
      border-color: var(--tab-active);
      box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.15);
    }

    .team-table input[type="number"] {
      -moz-appearance: textfield;
    }

    .team-table input[type="number"]::-webkit-inner-spin-button,
    .team-table input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    .turn-counter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--field-bg);
      border: 2px solid var(--ink);
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 16px;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s, transform 0.1s;
    }

    .turn-counter:active {
      transform: scale(0.92);
    }

    .char-name {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }

    .char-class {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .btn-sm {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      border-radius: var(--radius-sm);
      border: 1px solid var(--input-border);
      background: var(--field-bg);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sm:hover { background: var(--line); }

    .btn-add {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .btn-add:hover { filter: brightness(1.1); }

    .btn-remove {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    .btn-remove:hover { filter: brightness(1.1); }

    .btn-raz {
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--muted);
    }
    .btn-raz:hover { background: var(--line); }

    .col-name { text-align: left; min-width: 120px; }
    .col-class { min-width: 80px; }
    .col-num { width: 60px; }
    .col-text { min-width: 70px; }
    .col-counter { width: 50px; }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-style: italic;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .topbar { padding: 0 10px; gap: 6px; }
      .logo { font-size: 14px; }
      .tab-bar { padding: 4px 10px; gap: 2px; top: 44px; }
      .tab { padding: 6px 12px; font-size: 12px; }
      .main { padding: 12px 10px 60px; }

      .team-table { font-size: 11px; }
      .team-table th { font-size: 9px; padding: 4px 3px; }
      .team-table td { padding: 3px 2px; }
      .team-table input { font-size: 11px; padding: 3px 2px; }

      .turn-counter { width: 30px; height: 30px; font-size: 13px; }

      .btn-group { flex-wrap: wrap; gap: 4px; }
      .btn-sm { padding: 4px 8px; font-size: 10px; }

      .tab-equipe-mobile { display: block; }
    }
  </style>
</head>
<body>

</body>
</html>
