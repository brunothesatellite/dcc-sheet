<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maquette Mage - Partie 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1eee8;
      --paper: #fff;
      --ink: #171717;
      --muted: #706d68;
      --line: #d7d1c8;
      --red: #c0392b;
      --field-bg: #dde4f0;
      --input-border: #9aa5b4;
      --header-bg: #1a1a2e;
      --header-text: #fff;
      --font-heading: 'Barlow Condensed', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius: 6px;
      --radius-sm: 4px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
      padding: 24px 16px;
    }

    .sheet-page {
      max-width: 640px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
    }

    .section-bar {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--header-text);
      background: var(--header-bg);
      padding: 8px 14px;
      border-radius: var(--radius);
      margin: 20px 0 12px;
    }

    .section-bar:first-child { margin-top: 0; }

    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: stretch;
    }

    .row > * { flex: 1; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--field-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      outline: none;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 24px;
      line-height: 1.4;
    }

    .label-on-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .label-on-line .field-label {
      white-space: nowrap;
    }

    .label-on-line input {
      flex: 1;
      min-width: 80px;
    }

    .mod-text {
      font-size: 13px;
      color: var(--ink);
      padding: 8px 0;
    }

    .dtable {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .dtable th {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      padding: 5px 8px;
      text-align: center;
    }

    .dtable td {
      border: 1.5px solid var(--ink);
      padding: 3px 4px;
      text-align: center;
    }

    .dtable td:first-child { text-align: left; }

    .dtable input,
    .dtable textarea {
      width: 100%;
      text-align: center;
      border: none;
      background: transparent;
      font-size: 12px;
      padding: 3px;
      font-family: var(--font-body);
      color: var(--ink);
      outline: none;
    }

    .dtable td:first-child input,
    .dtable td:first-child textarea { text-align: left; }

    .dtable textarea {
      resize: vertical;
      min-height: 22px;
      line-height: 1.4;
      overflow: auto;
    }

    .dtable .row-num {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      width: 30px;
      vertical-align: top;
      padding-top: 6px;
    }

    .dtable td.sort-notes {
      padding: 2px 4px;
    }

    .dtable td.sort-notes textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 12px;
      padding: 3px;
      font-family: var(--font-body);
      color: var(--ink);
      outline: none;
      resize: vertical;
      min-height: 22px;
      line-height: 1.4;
    }
  </style>
</head>
