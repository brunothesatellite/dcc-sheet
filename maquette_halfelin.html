<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maquette Halfelin - Partie 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1eee8;
      --paper: #fff;
      --ink: #171717;
      --muted: #706d68;
      --line: #d7d1c8;
      --red: #c0392b;
      --field-bg: #dde4f0;
      --input-border: #9aa5b4;
      --header-bg: #1a1a2e;
      --header-text: #fff;
      --font-heading: 'Barlow Condensed', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius: 6px;
      --radius-sm: 4px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
      padding: 24px 16px;
    }

    .sheet-page {
      max-width: 640px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
    }

    .section-bar {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--header-text);
      background: var(--header-bg);
      padding: 8px 14px;
      border-radius: var(--radius);
      margin: 20px 0 12px;
    }

    .section-bar:first-child { margin-top: 0; }

    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: stretch;
    }

    .row > * { flex: 1; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--field-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      outline: none;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    .label-on-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .label-on-line .field-label {
      white-space: nowrap;
    }

    .label-on-line input {
      flex: 1;
      min-width: 80px;
    }

    .combat-info {
      background: var(--field-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.7;
      height: 100%;
    }

    .combat-info-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .combat-info ul {
      margin: 0;
      padding-left: 16px;
      list-style: disc;
    }

    .combat-info li {
      margin-bottom: 2px;
    }

    .capacites-grid {
      display: flex;
      gap: 12px;
    }

    .capacites-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .capacites-right {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .cap-label {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink);
      padding: 8px 0;
    }
  </style>
</head>
<body>

<div class="sheet-page">
  <div class="section-bar">Capacités de halfelin</div>

  <div class="capacites-grid">
    <!-- Colonne gauche -->
    <div class="capacites-left">
      <div class="label-on-line">
        <label class="field-label">Infravision</label>
        <input type="text" placeholder="">
      </div>
      <div class="label-on-line">
        <label class="field-label">Discrétion :</label>
        <input type="text" placeholder="">
      </div>
      <div class="cap-label">Porte-bonheur</div>
      <div class="cap-label">Petite taille/lenteur</div>
    </div>
    <!-- Colonne droite -->
    <div class="capacites-right">
      <div class="combat-info">
        <div class="combat-info-title">Combat à deux armes</div>
        <ul>
          <li>Des d'action d16-d16</li>
          <li>Crit sur 16 naturel</li>
          <li>Maladresse/tonnelez sur xx 1</li>
          <li>si Agi &gt;16, règles normales</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="section-bar">Notes</div>

  <div class="row">
    <div class="field">
      <textarea rows="6" placeholder=""></textarea>
    </div>
  </div>
</div>

</body>
</html>
